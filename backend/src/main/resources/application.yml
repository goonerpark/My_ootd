server:
  port: 8080

spring:
  application:
    name: ootd-backend
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:150MB}
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3307/my_ootd}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:0909}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: info

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:replace-with-a-long-random-secret-key-at-least-32-bytes}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

weather:
  provider: ${WEATHER_PROVIDER:openweather}
  cache-refresh-minutes: ${WEATHER_CACHE_REFRESH_MINUTES:60}
  openweather:
    api-key: ${OPENWEATHER_API_KEY:}
    base-url: https://api.openweathermap.org
    lat: 37.5665
    lon: 126.9780
    units: metric
    lang: kr
    region-code: SEOUL

gemini:
  enabled: ${GEMINI_ENABLED:true}
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

ootd:
  image-storage:
    local-dir: ${OOTD_IMAGE_LOCAL_DIR:uploads/ootd-reviews}
    url-prefix: ${OOTD_IMAGE_URL_PREFIX:http://localhost:8080/uploads/ootd-reviews/}

closet:
  image-storage:
    local-dir: ${CLOSET_IMAGE_LOCAL_DIR:uploads/closet-items}
    url-prefix: ${CLOSET_IMAGE_URL_PREFIX:http://localhost:8080/uploads/closet-items/}

# TODO: Redis/S3/FastAPI integration settings will be added in a later step
