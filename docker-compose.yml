version: "3.9"

services:
  mariadb:
    image: mariadb:11.4
    container_name: ootd-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-my_ootd}
      MARIADB_USER: ${MARIADB_USER:-ootd_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-ootd_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MARIADB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ootd-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080

      DB_URL: ${DB_URL:-jdbc:mariadb://mariadb:3306/my_ootd}
      DB_USERNAME: ${DB_USERNAME:-ootd_user}
      DB_PASSWORD: ${DB_PASSWORD:-ootd_password}

      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-key-at-least-32-bytes}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-3600000}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-openweather}
      WEATHER_CACHE_REFRESH_MINUTES: ${WEATHER_CACHE_REFRESH_MINUTES:-60}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}

      GEMINI_ENABLED: ${GEMINI_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}

      OOTD_IMAGE_LOCAL_DIR: ${OOTD_IMAGE_LOCAL_DIR:-/app/uploads/ootd-reviews}
      OOTD_IMAGE_URL_PREFIX: ${OOTD_IMAGE_URL_PREFIX:-http://localhost:8080/uploads/ootd-reviews/}
      CLOSET_IMAGE_LOCAL_DIR: ${CLOSET_IMAGE_LOCAL_DIR:-/app/uploads/closet-items}
      CLOSET_IMAGE_URL_PREFIX: ${CLOSET_IMAGE_URL_PREFIX:-http://localhost:8080/uploads/closet-items/}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ootd-frontend
    restart: "no"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mariadb_data:
  backend_uploads:
